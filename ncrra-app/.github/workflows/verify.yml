name: Verify NCRRA foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  contract-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI document
        run: npx --yes @redocly/cli@1.27.0 lint implementation/contracts/openapi/ticketing.openapi.yaml
      - name: Validate ticket event schema JSON
        run: node -e "JSON.parse(require('fs').readFileSync('implementation/contracts/events/ticket-created.v1.json','utf8')); console.log('event schema parses')"

  secret-and-vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files for exposed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: HEAD~1
          head: HEAD
          extra_args: --only-verified
      - name: Scan source and infrastructure configuration
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
