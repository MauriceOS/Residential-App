name: ncrra_member_app
description: NCRRA member mobile application visual implementation foundation.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_appauth: ^12.0.2
  flutter_secure_storage: ^11.0.0
  flutter_lucide: ^1.34.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Copy the approved NCRRA mark here from the supplied design assets before a device build.
    - assets/brand/ncrra_mark.png
