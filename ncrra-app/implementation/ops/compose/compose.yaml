# NCRRA VPS-first baseline. Only caddy publishes host ports; all other services remain on internal networks.
name: ncrra-platform

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, application]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start --proxy-headers=xforwarded --hostname-strict=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    depends_on: [postgres]
    networks: [application, data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: platform_admin
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      MEMBERSHIP_DB_PASSWORD: ${MEMBERSHIP_DB_PASSWORD}
      TICKETING_DB_PASSWORD: ${TICKETING_DB_PASSWORD}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-service-databases.sql:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d platform_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    networks: [application]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    networks: [application]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  ticketing-api:
    image: ghcr.io/ncrra/platform-ticketing:${NCRRA_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      ConnectionStrings__Ticketing: Host=postgres;Port=5432;Database=ticketing;Username=ticketing_app;Password=${TICKETING_DB_PASSWORD}
      Authentication__Authority: ${KEYCLOAK_INTERNAL_AUTHORITY}
      Authentication__Audience: ncrra-mobile-dev
    depends_on: [postgres, rabbitmq, keycloak, otel-collector]
    networks: [application, data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  membership-api:
    image: ghcr.io/ncrra/platform-membership:${NCRRA_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      ConnectionStrings__Membership: Host=postgres;Port=5432;Database=membership;Username=membership_app;Password=${MEMBERSHIP_DB_PASSWORD}
      Authentication__Authority: ${KEYCLOAK_INTERNAL_AUTHORITY}
      Authentication__Audience: ncrra-mobile-dev
    depends_on: [postgres, rabbitmq, keycloak, otel-collector]
    networks: [application, data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  provider-adapter:
    image: ghcr.io/ncrra/platform-provider-adapter:${NCRRA_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      NCRRA_PROVIDER_INTEGRATION_ENABLED: ${NCRRA_PROVIDER_INTEGRATION_ENABLED:-false}
    depends_on: [rabbitmq, otel-collector]
    networks: [application]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: [./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro]
    networks: [application, observability]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [observability]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes: [grafana_data:/var/lib/grafana]
    networks: [observability]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  loki:
    image: grafana/loki:3.2.0
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks: [observability]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: [./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]
    networks: [observability]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  edge: {}
  application:
    internal: true
  data:
    internal: true
  observability:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
  postgres_data: {}
  rabbitmq_data: {}
  redis_data: {}
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}
